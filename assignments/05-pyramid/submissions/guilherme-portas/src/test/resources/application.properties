weather.url = http://localhost:8089
weather.api_secret=someAppId

# Sobrescreve o datasource de producao (PostgreSQL) para testes locais sem Docker.
# Codigo original do tutorial nao trazia estas linhas (dependia de Postgres em 15432);
# adicionadas para permitir `mvn test` offline com H2 em memoria.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.generate-unique-name=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
