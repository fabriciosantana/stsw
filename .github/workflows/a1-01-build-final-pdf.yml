name: Build final A1-01 presentation PDF

on:
  push:
    branches:
      - a1-01-testng
    paths:
      - '.github/workflows/a1-01-build-final-pdf.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-pptx
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress fonts-dejavu-core

      - name: Restore deck generator
        env:
          DECK_PAYLOAD: ''
        run: |
          python - <<'PY'
          import base64, gzip, os, pathlib
          data = base64.b64decode(os.environ["DECK_PAYLOAD"])
          pathlib.Path("/tmp/build_deck.py").write_bytes(gzip.decompress(data))
          PY

      - name: Generate redesigned presentation
        run: |
          OUT="$RUNNER_TEMP/TestNG_Leonardo_A1-01_Redesign.pptx" python /tmp/build_deck.py
          mkdir -p "$RUNNER_TEMP/pdf"
          libreoffice --headless --convert-to pdf --outdir "$RUNNER_TEMP/pdf" "$RUNNER_TEMP/TestNG_Leonardo_A1-01_Redesign.pptx"
          cp "$RUNNER_TEMP/pdf/TestNG_Leonardo_A1-01_Redesign.pdf" "workshops/01-test/submissions/leonardo-freitas/leonardo-freitas.pdf"
          test -s "workshops/01-test/submissions/leonardo-freitas/leonardo-freitas.pdf"

      - name: Commit final PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "workshops/01-test/submissions/leonardo-freitas/leonardo-freitas.pdf"
          if git diff --cached --quiet; then
            echo "PDF already up to date."
          else
            git commit -m "A1-01 TestNG: replace presentation with final redesigned PDF"
            git push
          fi
