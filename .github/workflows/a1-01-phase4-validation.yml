name: A1-01 Phase 4 Validation

on:
  push:
    branches:
      - a1-01-testng
    paths:
      - 'workshops/01-test/submissions/leonardo-freitas/**'
      - '.github/workflows/a1-01-phase4-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check required deliverables
        run: |
          test -f workshops/01-test/submissions/leonardo-freitas/README.md
          test -f workshops/01-test/submissions/leonardo-freitas/leonardo-freitas.pdf
          test -f workshops/01-test/submissions/leonardo-freitas/pom.xml
          test -f workshops/01-test/submissions/leonardo-freitas/testng.xml

      - name: Run default TestNG tests
        working-directory: workshops/01-test/submissions/leonardo-freitas
        run: mvn -B test

      - name: Run XML parallel suite
        working-directory: workshops/01-test/submissions/leonardo-freitas
        run: mvn -B -Psuite test
