name: A1-01 TestNG Validation

on:
  push:
    branches:
      - a1-01-testng
    paths:
      - 'workshops/01-test/submissions/leonardo-freitas/**'
      - '.github/workflows/a1-01-testng-validation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run default TestNG tests
        working-directory: workshops/01-test/submissions/leonardo-freitas
        run: mvn -B test

      - name: Run TestNG XML parallel suite
        working-directory: workshops/01-test/submissions/leonardo-freitas
        run: mvn -B -Psuite test
