name: Temporary P2-12 SSRFmap local lab validation
on:
  push:
    branches: [p2-12-ssrf-leonardo]
    paths: [.github/workflows/p2-12-ssrfmap-local.yml]
permissions:
  contents: write
jobs:
  local-ssrfmap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Run controlled localhost-only SSRFmap
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/prompts/submissions/leonardo-freitas"
          python "$ROOT/lab/ssrf_lab.py" --serve > /tmp/p2-12-lab-server.log 2>&1 &
          LAB_PID=$!
          trap 'kill "$LAB_PID" 2>/dev/null || true' EXIT
          sleep 2
          python "$ROOT/lab/ssrf_lab.py" --demo > /tmp/p2-12-demo-again.txt
          git clone --depth 1 https://github.com/swisskyrepo/SSRFmap.git /tmp/p2-12-ssrfmap
          cd /tmp/p2-12-ssrfmap
          printf '19081\n19082\n' > data/ports
          set +e
          timeout 110s uv run python ssrfmap.py \
            -r "$ROOT/lab/request-ssrfmap.txt" \
            -p url -m portscan --level 1 \
            --logfile /tmp/p2-12-ssrfmap-tool.log > /tmp/p2-12-ssrfmap-stdout.log 2>&1
          EXIT_CODE=$?
          set -e
          mkdir -p "$ROOT/evidencias"
          {
            echo "P2-12 SSRFmap real execution in isolated GitHub Actions runner"
            echo "Execution: SSRFmap official source cloned on runner; targets: 127.0.0.1:19081 and :19082 ONLY"
            echo "SSRFmap exit code: $EXIT_CODE"
            echo
            echo "SSRFmap stdout and stderr:"
            cat /tmp/p2-12-ssrfmap-stdout.log
            echo
            echo "Local server log:"
            cat /tmp/p2-12-lab-server.log
            echo
            echo "Local Python test log:"
            cat /tmp/p2-12-demo-again.txt
          } > "$ROOT/evidencias/resultado-ssrfmap-github-actions.txt"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "SSRFmap execution did not finish successfully, see log"
          fi
      - name: Commit evidence log (including tool errors if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prompts/submissions/leonardo-freitas/evidencias/resultado-ssrfmap-github-actions.txt
          git commit -m "P2-12: record actual restricted SSRFmap runner output"
          git push
